[project]
name = "portiq"
version = "0.1.0"
description = "Multi-agent job hub: Uzbekistan, Korea and worldwide"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["libs/common", "."]
include = ["portiq_common*", "agents*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["libs/common", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["portiq_common", "agents", "services"]
